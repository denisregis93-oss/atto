<title>Agenda do Conselho</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* Layout: app shell (side or top nav) + main column; options drawer on the right; tab bar on phones. */
:root {
  --bg: #f3f5f5; --surface: #ffffff; --surface-2: #eaeeee; --fg: #131a1c; --muted: #56656a; --line: #d9e0e1;
  --ok: #17734a; --warn: #9a5800; --bad: #b42318; --done: #66737a;
  --acc: var(--acc-l); --acc-fg: #ffffff;
  --font-ui: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --radius: 10px; --pad: 18px; --row: 46px; --gap: 16px;
  --shadow: 0 1px 2px rgba(16,24,28,.06), 0 4px 16px rgba(16,24,28,.05);
}
:root[data-palette="petroleo"] { --acc-l: #0c5b67; --acc-d: #63c2cf; }
:root[data-palette="marinho"]  { --acc-l: #1e3a8a; --acc-d: #91a9ff; }
:root[data-palette="grafite"]  { --acc-l: #7a5a10; --acc-d: #dcb860; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1315; --surface: #151c1f; --surface-2: #1c2528; --fg: #e7edee; --muted: #97a5a9; --line: #29353a;
    --ok: #5cc48d; --warn: #f0b35a; --bad: #f07a6e; --done: #8a979c;
    --acc: var(--acc-d); --acc-fg: #0b1214;
    --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1315; --surface: #151c1f; --surface-2: #1c2528; --fg: #e7edee; --muted: #97a5a9; --line: #29353a;
  --ok: #5cc48d; --warn: #f0b35a; --bad: #f07a6e; --done: #8a979c;
  --acc: var(--acc-d); --acc-fg: #0b1214;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
:root[data-density="compact"] { --pad: 12px; --row: 38px; --gap: 10px; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.serif { font-family: var(--font-display); font-weight: 600; letter-spacing: -.01em; }
.muted { color: var(--muted); }
.tnum { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.soft-acc { background: color-mix(in srgb, var(--acc) 12%, transparent); color: var(--acc); }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0,1fr); min-height: 100%; }
.app[data-nav="top"] { grid-template-columns: minmax(0,1fr); }
.sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 20px 14px; background: var(--surface); border-right: 1px solid var(--line); }
.app[data-nav="top"] .sidebar { display: none; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--acc); color: var(--acc-fg); display: grid; place-items: center; font-family: var(--font-display); font-weight: 600; font-size: 17px; }
.brand b { display: block; font-size: 14px; line-height: 1.2; }
.brand small { color: var(--muted); font-size: 12px; }
.nav-link { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 600; border: 0; background: none; text-align: left; width: 100%; }
.nav-link:hover { background: var(--surface-2); color: var(--fg); }
.nav-link[aria-current="page"] { background: color-mix(in srgb, var(--acc) 12%, transparent); color: var(--acc); }
.nav-link svg { width: 18px; height: 18px; flex: none; }
.nav-count { margin-left: auto; font-size: 11px; background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); padding: 1px 7px; border-radius: 99px; }
.side-foot { margin-top: auto; display: flex; gap: 10px; align-items: center; padding: 10px 8px 0; border-top: 1px solid var(--line); }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.topbar .brand { padding: 0; display: none; }
.app[data-nav="top"] .topbar .brand { display: flex; }
.topnav { display: none; gap: 2px; }
.app[data-nav="top"] .topnav { display: flex; }
.topnav .nav-link { width: auto; padding: 7px 11px; }
.topnav .nav-link svg { display: none; }
.search { flex: 1; max-width: 360px; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; height: 36px; color: var(--muted); margin-left: auto; }
.search input { border: 0; background: none; outline: none; width: 100%; min-width: 0; }
.main-col { min-width: 0; display: flex; flex-direction: column; }
main { padding-block: 24px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1180px; width: 100%; margin: 0 auto; }
.tabbar { display: none; }

/* ---------- Primitives ---------- */
a.btn { text-decoration: none; color: inherit; }
a.btn-primary { color: var(--acc-fg); }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: color-mix(in srgb, var(--fg) 30%, var(--line)); }
.btn svg { width: 16px; height: 16px; }
.btn-primary { background: var(--acc); color: var(--acc-fg); border-color: transparent; }
.btn-primary:hover { filter: brightness(1.08); border-color: transparent; }
.btn-ghost { border-color: transparent; background: none; }
.btn-sm { height: 30px; padding: 0 10px; font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.pad { padding: var(--pad); }
.row { display: flex; gap: var(--gap); align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: var(--gap); }
.grid-2 { display: grid; grid-template-columns: minmax(0,1.6fr) minmax(0,1fr); gap: var(--gap); }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: var(--gap); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.page-head h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(24px, 3vw, 32px); letter-spacing: -.015em; line-height: 1.15; }
.section-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.section-title h2 { font-size: 15px; font-weight: 700; }

.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 99px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.plain::before { display: none; }
.s-ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
.s-warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.s-bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 13%, transparent); }
.s-done { color: var(--done); background: color-mix(in srgb, var(--done) 14%, transparent); }
.s-acc { color: var(--acc); background: color-mix(in srgb, var(--acc) 13%, transparent); }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }

.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; background: color-mix(in srgb, var(--acc) 16%, var(--surface)); color: var(--acc); flex: none; }
.avatar.lg { width: 46px; height: 46px; font-size: 15px; }
.avatars { display: flex; }
.avatars .avatar { border: 2px solid var(--surface); margin-left: -8px; }
.avatars .avatar:first-child { margin-left: 0; }

.list { display: flex; flex-direction: column; }
.list-item { display: flex; align-items: center; gap: 12px; min-height: var(--row); padding: 10px var(--pad); border-top: 1px solid var(--line); }
.list-item:first-child { border-top: 0; }
.list-item.click { cursor: pointer; }
.list-item.click:hover { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
.li-main { min-width: 0; flex: 1; }
.li-title { font-weight: 600; }
.li-sub { color: var(--muted); font-size: 13px; }

.date-block { width: 52px; flex: none; text-align: center; border-radius: 8px; border: 1px solid var(--line); padding: 4px 0; background: var(--surface); }
.date-block b { display: block; font-size: 19px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.date-block span { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }

.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; position: relative; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--acc); border-radius: 99px; }
.bar.warn > i { background: var(--warn); }

/* ---------- Home A: next meeting ---------- */
.hero { padding: calc(var(--pad) + 6px); display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 20px; position: relative; overflow: hidden; }
.hero h2 { font-family: var(--font-display); font-weight: 600; font-size: clamp(22px, 2.6vw, 28px); line-height: 1.2; margin: 6px 0 10px; }
.countdown { text-align: center; padding: 14px 18px; border-radius: 12px; background: color-mix(in srgb, var(--acc) 10%, transparent); color: var(--acc); align-self: start; }
.countdown b { display: block; font-family: var(--font-display); font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.countdown span { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.meta { display: flex; gap: 6px 18px; flex-wrap: wrap; color: var(--muted); font-weight: 500; }
.meta span { display: inline-flex; align-items: center; gap: 6px; }
.meta svg { width: 15px; height: 15px; }
.checklist { display: grid; gap: 8px; margin-top: 18px; }
.check { display: flex; gap: 10px; align-items: flex-start; }
.check .dot { width: 20px; height: 20px; border-radius: 50%; flex: none; display: grid; place-items: center; margin-top: 1px; }
.check .dot svg { width: 12px; height: 12px; }
.check.ok .dot { background: var(--ok); color: var(--surface); }
.check.pending .dot { border: 2px solid var(--warn); }
.quorum { display: grid; gap: 6px; margin-top: 18px; max-width: 440px; }

/* ---------- KPI ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: var(--gap); margin-bottom: var(--gap); }
.kpi { padding: var(--pad); border-left: 4px solid var(--k, var(--line)); }
.kpi b { display: block; font-size: 30px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; margin-top: 4px; color: var(--k, var(--fg)); }

/* ---------- Calendar ---------- */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); border-top: 1px solid var(--line); }
.cal-h { padding: 8px; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--line); }
.cal-d { min-height: 84px; padding: 6px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 12px; min-width: 0; }
.cal-d:nth-child(7n) { border-right: 0; }
.cal-d.out { color: var(--muted); background: color-mix(in srgb, var(--surface-2) 45%, transparent); }
.cal-d .n { font-weight: 700; font-variant-numeric: tabular-nums; }
.cal-d.today .n { background: var(--acc); color: var(--acc-fg); border-radius: 6px; padding: 0 6px; }
.cal-ev { display: block; margin-top: 4px; padding: 2px 6px; border-radius: 5px; font-size: 11px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 0; width: 100%; text-align: left; }
.cal-ev.due { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }

.year { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: 6px; }
.month { padding: 10px 8px; border-radius: 8px; background: var(--surface-2); min-width: 0; }
.month.now { outline: 2px solid var(--acc); }
.month small { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.month .pips { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
.pip { width: 9px; height: 9px; border-radius: 50%; background: var(--acc); }
.pip.com { background: transparent; border: 2px solid var(--acc); }
.pip.past { opacity: .4; }

/* ---------- Meeting ---------- */
.steps { display: flex; gap: 0; margin: 4px 0 0; overflow-x: auto; padding-bottom: 2px; }
.step { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.step + .step::before { content: ""; width: 28px; height: 2px; background: var(--line); margin: 0 8px; }
.step i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-style: normal; font-size: 11px; }
.step.done { color: var(--fg); }
.step.done i { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.step.cur { color: var(--acc); }
.step.cur i { border-color: var(--acc); background: color-mix(in srgb, var(--acc) 14%, transparent); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 20px 0 16px; overflow-x: auto; }
.tab { padding: 10px 14px; border: 0; background: none; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tab[aria-selected="true"] { color: var(--acc); border-color: var(--acc); }
.tab .tag { height: 18px; padding: 0 6px; font-size: 11px; }
.single-index { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0; }
.single-sec { margin-top: 26px; scroll-margin-top: 80px; }
.agenda-item { display: grid; grid-template-columns: 34px minmax(0,1fr) auto; gap: 12px; padding: 14px var(--pad); border-top: 1px solid var(--line); align-items: start; }
.agenda-item:first-child { border-top: 0; }
.agenda-num { width: 28px; height: 28px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.agenda-item.auto { background: color-mix(in srgb, var(--acc) 5%, transparent); }
.auto-list { margin-top: 10px; display: grid; gap: 6px; }
.auto-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.t-del { color: var(--acc); background: color-mix(in srgb, var(--acc) 12%, transparent); }
.t-inf { color: var(--muted); background: var(--surface-2); }
.t-dis { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); }
.file-ic { width: 34px; height: 40px; border-radius: 6px; flex: none; display: grid; place-items: end center; padding-bottom: 4px; font-size: 9px; font-weight: 800; color: var(--surface); }
.file-ic.pdf { background: #b42318; } .file-ic.xls { background: #17734a; } .file-ic.ppt { background: #b9541a; } .file-ic.doc { background: #1e4fa8; }
.drop { border: 2px dashed var(--line); border-radius: var(--radius); padding: 22px 16px; text-align: center; display: grid; gap: 6px; justify-items: center; cursor: pointer; background: var(--surface); transition: border-color .15s, background .15s; }
.drop:hover, .drop.over { border-color: var(--acc); background: color-mix(in srgb, var(--acc) 6%, var(--surface)); }
.drop-ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--acc) 12%, transparent); color: var(--acc); }
.link { color: var(--acc); font-weight: 700; text-decoration: underline; cursor: pointer; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.file-ic.img { background: #6b4fa0; }
.notify { background: color-mix(in srgb, var(--acc) 7%, transparent); }
.minutes { font-family: var(--font-display); font-size: 16px; line-height: 1.7; max-width: 68ch; }
.minutes p { margin: 0 0 12px; }
.minutes .hl { background: color-mix(in srgb, var(--warn) 18%, transparent); border-radius: 3px; padding: 0 2px; }

/* ---------- Actions ---------- */
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filter { height: 32px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13px; }
.filter[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.kanban { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: var(--gap); overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--surface-2); border-radius: var(--radius); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.col-h { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 4px; font-weight: 700; }
.a-card { padding: 12px; display: grid; gap: 8px; border-left: 3px solid var(--s); }
.a-card .t { font-weight: 700; line-height: 1.35; }
.a-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 10px var(--pad); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px var(--pad); border-bottom: 1px solid var(--line); vertical-align: middle; height: var(--row); }
tr:last-child td { border-bottom: 0; }
.tl { position: relative; padding-left: 22px; display: grid; gap: 18px; }
.tl::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.tl-m { position: relative; }
.tl-m::before { content: ""; position: absolute; left: -22px; top: 4px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 3px solid var(--acc); }
.tl-m h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; }

/* ---------- People ---------- */
.person { padding: var(--pad); display: grid; gap: 12px; }
.person-top { display: flex; gap: 12px; align-items: center; }
.channels { display: flex; gap: 6px; }
.ch { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); }
.ch.on { background: color-mix(in srgb, var(--acc) 13%, transparent); color: var(--acc); }
.ch svg { width: 14px; height: 14px; }

/* ---------- Drawer (design options) ---------- */
.fab { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 40; height: 46px; padding: 0 18px; border-radius: 99px; border: 0; background: var(--fg); color: var(--bg); font-weight: 800; display: inline-flex; gap: 8px; align-items: center; box-shadow: 0 6px 24px rgba(0,0,0,.22); }
.fab svg { width: 18px; height: 18px; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 100%); z-index: 60; background: var(--surface); border-left: 1px solid var(--line); box-shadow: -12px 0 40px rgba(0,0,0,.14); display: flex; flex-direction: column; transform: translateX(105%); transition: transform .25s ease; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer.open { transform: none; }
.drawer-h { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.drawer-h h2 { font-size: 16px; }
.drawer-b { overflow-y: auto; padding: 6px 18px 24px; flex: 1; }
.opt { padding: 16px 0; border-bottom: 1px solid var(--line); }
.opt h3 { font-size: 13px; font-weight: 800; display: flex; gap: 8px; align-items: baseline; }
.opt h3 .num { color: var(--muted); font-variant-numeric: tabular-nums; }
.opt p { margin: 4px 0 10px; color: var(--muted); font-size: 13px; }
.choices { display: grid; gap: 6px; }
.choice { display: grid; grid-template-columns: 18px minmax(0,1fr); gap: 10px; align-items: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); text-align: left; }
.choice:hover { border-color: color-mix(in srgb, var(--acc) 50%, var(--line)); }
.choice[aria-checked="true"] { border-color: var(--acc); background: color-mix(in srgb, var(--acc) 7%, var(--surface)); }
.radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); margin-top: 1px; }
.choice[aria-checked="true"] .radio { border: 5px solid var(--acc); }

function monthGrid(y, mo){
  const first = new Date(y, mo, 1); const start = new Date(first); start.setDate(1 - first.getDay());
  let h = SEM.map(s => `<div class="cal-h">${s}</div>`).join("");
  for (let i = 0; i < 35; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const evs = MEETINGS.filter(m => m.data === key).map(m => `<button class="cal-ev soft-acc" data-meeting="${m.id}" title="${esc(mName(m))}">${m.hora} ${m.org==="Conselho de Administração"?"RCA":"Com. Auditoria"}</button>`).join("")
      + ACTIONS.filter(a => a.prazo === key && !a.feito).map(a => `<span class="cal-ev due" title="${esc(a.t)}">Prazo: ${esc(a.t)}</span>`).join("");
    const isToday = d.toDateString() === TODAY.toDateString();
    h += `<div class="cal-d ${d.getMonth()!==mo?"out":""} ${isToday?"today":""}"><span class="n">${d.getDate()}</span>${evs}</div>`;
  }
  return `<div class="cal">${h}</div>`;
}

    <div class="field"><span class="lbl">Convocar por</span><div class="row" style="gap:16px">${chans.map(([k,l]) => `<label class="tog"><input type="checkbox" id="nmCh-${k}" data-ch="${k}" ${NM.ch[k]?"checked":""}> ${l}</label>`).join("")}</div></div>
  </div>
  <div class="modal-prev"><div class="row" style="justify-content:space-between"><b>Prévia da convocação</b><div class="seg" style="width:auto">${chans.map(([k,l]) => `<button type="button" data-prev="${k}" aria-pressed="${NM.prev===k}">${l}</button>`).join("")}</div></div>
    <div id="prevBox">${msgPreview()}</div>
    <div class="card pad" style="display:grid;gap:8px"><div class="row" style="justify-content:space-between"><b>Destinatários</b><span class="li-sub">${count} conselheiros + secretaria</span></div><div class="avatars">${PEOPLE.map(p => `<div class="avatar" title="${esc(p.nome)}">${ini(p.nome)}</div>`).join("")}</div><div class="li-sub">Cada um recebe pelos canais que escolheu no cadastro. Lembretes automáticos 1 dia e 1 hora antes.</div></div>
    <div class="row" style="justify-content:flex-end;gap:8px"><button type="button" class="btn btn-ghost" id="nmCancel">Cancelar</button><button type="submit" class="btn btn-primary">${ic("send",16)} Criar e convocar todos</button></div>
  </div></form></div>`;
  $("#nmOrg").value = NM.org;
}
function readModal(){ NM.org = $("#nmOrg").value; NM.data = $("#nmData").value || NM.data; NM.hora = $("#nmHora").value || NM.hora; NM.local = $("#nmLocal").value; NM.pauta = $("#nmPauta").value; }
function createMeeting(){
  readModal();
  const id = "n" + Date.now();
  const chans = Object.keys(NM.ch).filter(k => NM.ch[k]);
  const m = { id, org:NM.org, tipo:NM.tipo, num:"4ª", data:NM.data, hora:NM.hora, fim:"—", formato:NM.formato, local:NM.local || "a definir", fase:1,
    rsvp:Object.fromEntries(PEOPLE.map(p => [p.id,"env"])), pauta:[{ t:"Acompanhamento de deliberações anteriores", tipo:"inf", rel:"ac", min:10, docs:0, auto:true },{ t:NM.pauta || "Ordem do dia a definir", tipo:"del", rel:"hp", min:45, docs:0 }], docs:[], deliberacoes:[] };
  MEETINGS.push(m);
  const entry = { quando:"2026-11-10 09:15", msg:`Convocação · ${m.num} ${m.org === "Conselho de Administração" ? "RCA" : m.org} ${m.tipo} · ${fmtShort(m.data)} ${m.hora}`, canal:chans, para:`${PEOPLE.length} conselheiros`, ent:0, lid:0, env:true };
  LOG.unshift(entry);
  $("#modalRoot").innerHTML = "";
  UI.meetingId = id; UI.tab = "presenca";
  location.hash = "reuniao"; render();
  toast(`Reunião criada. Convocação saindo para ${PEOPLE.length} conselheiros por ${chans.map(c => ({mail:"e-mail",wa:"WhatsApp",sms:"SMS"}[c])).join(", ")}.`);
  const seq = [["hp","sim"],["lf","sim"],["pt","sim"],["ra","sim"],["ms","pendente"],["jm","pendente"],["bl","pendente"]];
  seq.forEach(([pid,v],i) => setTimeout(() => { m.rsvp[pid] = v; entry.ent = Math.min(PEOPLE.length, entry.ent + 1); entry.lid = Math.max(0, entry.ent - 2); if (i === seq.length-1) entry.env = false; if (["reuniao","mensagens"].includes(currentView())) render(); }, 900 + i*650));
}

/* ---------- Render & events ---------- */
function render(){
  applyOpts(); renderNav();
  const v = currentView();
  const html = v === "agenda" ? viewAgenda() : v === "reuniao" ? viewMeeting() : v === "acoes" ? viewActions() : v === "conselheiros" ? viewPeople() : v === "mensagens" ? viewLog() : viewHome();
  $("#view").innerHTML = html;
}
let toastT;
function toast(t){ const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 3600); }

document.addEventListener("click", e => {
  if (e.target.closest("#drop") && !e.target.closest("label, input")) { $("#fileIn").click(); return; }
  const t = e.target.closest("button, a, [data-meeting]"); if (!t) return;
  if (t.dataset.notify) { const m = MEETINGS.find(x => x.id === t.dataset.notify); const n = UI.newDocs;
    LOG.unshift({ quando:"2026-11-12 10:30", msg:`Material novo · ${mName(m)} · ${n} arquivo${n>1?"s":""}`, canal:["mail"], para:"7 conselheiros", ent:7, lid:0 });
    m.docs.forEach(d => d.novo = false); UI.newDocs = 0; render(); toast(`Um único e-mail foi para os 7 conselheiros, listando os ${n} arquivo${n>1?"s":""} novo${n>1?"s":""}.`); return; }
  if (t.dataset.newver) { const m = MEETINGS.find(x => x.id === UI.meetingId); const f = m.docs[+t.dataset.newver];
    f.v = "v" + (parseInt(f.v.slice(1), 10) + 1); f.lidos = 0; if (!f.novo) { f.novo = true; UI.newDocs++; } render(); toast(`Versão ${f.v} publicada. A anterior fica guardada no histórico.`); return; }
  if (t.dataset.signed) { const m = MEETINGS.find(x => x.id === t.dataset.signed); m.fase = 5; render(); toast("Ata assinada arquivada. A reunião passa para \"Ata assinada\"."); return; }
  if (t.dataset.meeting) { e.preventDefault(); UI.meetingId = t.dataset.meeting; UI.tab = t.dataset.tab || "pauta"; if (location.hash === "#reuniao") render(); else location.hash = "reuniao"; scrollTo(0,0); return; }
  if (t.dataset.go) { location.hash = t.dataset.go; return; }
  if (t.dataset.toast) { toast(t.dataset.toast); return; }
  if (t.dataset.tabSel) { UI.tab = t.dataset.tabSel; render(); return; }
  if (t.dataset.jump) { e.preventDefault(); const s = document.getElementById(t.dataset.jump); if (s) s.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); return; }
  if (t.dataset.filter) { UI.filter = t.dataset.filter; render(); return; }
  if (t.dataset.done) { ACTIONS.find(a => a.id === t.dataset.done).feito = true; render(); toast("Ação concluída. O conselho verá isso no acompanhamento da próxima reunião."); return; }
  if (t.dataset.undo) { ACTIONS.find(a => a.id === t.dataset.undo).feito = false; render(); return; }
  if (t.dataset.opt) { S[t.dataset.opt] = t.dataset.val; saveOpts(); if (t.dataset.opt === "chan") NM.ch = { mail:true, wa:S.chan!=="mail", sms:S.chan==="all" }; const sc = $("#drawerBody").scrollTop; renderDrawer(); $("#drawerBody").scrollTop = sc; render(); return; }
  if (t.dataset.nm) { readModal(); NM[t.dataset.nm] = t.dataset.v; if (t.dataset.nm === "formato") NM.local = t.dataset.v === "Presencial" ? "Sede · Sala do Conselho" : t.dataset.v === "Online" ? "Teams" : "Sede · Sala do Conselho + Teams"; renderModal(); return; }
  if (t.dataset.prev) { readModal(); NM.prev = t.dataset.prev; renderModal(); return; }
  if (t.id === "btnNew") { renderModal(); setTimeout(() => $("#nmData") && $("#nmData").focus(), 0); return; }
  if (t.id === "nmCancel") { $("#modalRoot").innerHTML = ""; return; }
  if (t.id === "fab") { openDrawer(!$("#drawer").classList.contains("open")); return; }
  if (t.id === "closeDrawer") { openDrawer(false); return; }
  if (t.id === "copySum") { const txt = "Minhas escolhas para o sistema do Conselho:\n" + summaryLines().map((l,i) => `${i+1}. ${l}`).join("\n");
    const ok = () => toast("Escolhas copiadas. Cole no chat."); const fail = () => { const r = document.createRange(); r.selectNodeContents($("#sumList")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Texto selecionado. Use Ctrl+C para copiar."); };
    try { navigator.clipboard.writeText(txt).then(ok, fail); } catch(err) { fail(); } return; }
  if (t.id === "resetOpts") { S = Object.assign({}, DEF); saveOpts(); renderDrawer(); render(); return; }
});
document.addEventListener("submit", e => { if (e.target.id === "nmForm") { e.preventDefault(); createMeeting(); } });
const fmtSize = b => b >= 1048576 ? (b/1048576).toFixed(1).replace(".", ",") + " MB" : Math.max(1, Math.round(b/1024)) + " KB";
function handleFiles(files){
  const m = MEETINGS.find(x => x.id === UI.meetingId); if (!m) return;
  const OK = { pdf:"pdf", doc:"doc", docx:"doc", xls:"xls", xlsx:"xls", csv:"xls", ppt:"ppt", pptx:"ppt", png:"img", jpg:"img", jpeg:"img" };
  Array.from(files).forEach(file => {
    const ext = (file.name.split(".").pop() || "").toLowerCase();
    if (!OK[ext]) { toast(`"${file.name}" não foi enviado: formato não aceito. Use PDF, Word, Excel, PowerPoint ou imagem.`); return; }
    if (file.size > 50 * 1048576) { toast(`"${file.name}" tem mais de 50 MB. Comprima o arquivo ou divida em partes.`); return; }
    const u = { n:file.name, ext:OK[ext], pct:0, item:Number(UI.upItem) };
    UI.uploads.push(u);
    const timer = setInterval(() => {
      u.pct = Math.min(100, u.pct + 8 + Math.round(Math.random() * 12));
      if (u.pct >= 100) { clearInterval(timer); UI.uploads = UI.uploads.filter(x => x !== u);
        m.docs.push({ n:file.name.replace(/\.[^.]+$/, ""), ext:u.ext, tam:fmtSize(file.size), v:"v1", lidos:0, item:u.item, novo:true, por:"Ana Costa" }); UI.newDocs++; }
      if (currentView() === "reuniao") render();
    }, 180);
  });
  render();
}
document.addEventListener("dragover", e => { const d = e.target.closest && e.target.closest("#drop"); if (d) { e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", e => { const d = e.target.closest && e.target.closest("#drop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", e => { const d = e.target.closest && e.target.closest("#drop"); if (d) { e.preventDefault(); handleFiles(e.dataTransfer.files); } });
document.addEventListener("change", e => {
  if (e.target.id === "fileIn") { handleFiles(e.target.files); return; }
  if (e.target.id === "upItem") { UI.upItem = e.target.value; return; } if (e.target.dataset.ch) { readModal(); NM.ch[e.target.dataset.ch] = e.target.checked; } if (e.target.id === "nmData" || e.target.id === "nmOrg") { readModal(); $("#prevBox").innerHTML = msgPreview(); } });
document.addEventListener("input", e => { if (["nmPauta","nmLocal","nmHora"].includes(e.target.id)) { readModal(); $("#prevBox").innerHTML = msgPreview(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape") { if ($("#modal")) $("#modalRoot").innerHTML = ""; else openDrawer(false); } });
$("#scrim").addEventListener("click", () => openDrawer(false));
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") toast("No sistema real: busca em atas, deliberações e no texto dos documentos."); });
addEventListener("hashchange", () => { render(); scrollTo(0,0); });

renderDrawer(); render();
if (innerWidth >= 1280) openDrawer(true);
})();
</script>
